history = 10000
history_file_path = "config/.massa_history"
timeout = 1000

[cli]
    approved_community_charter_file_path = "config/approved_community_charter.txt"

[default_node]
# The IP of your node. Works both with IPv4 (like 127.0.0.1) and IPv6 (like ::1) addresses, if the node is bound to the correct protocol.
ip = "127.0.0.1"
private_port = 33034
public_port = 33035
grpc_public_port = 33037
grpc_private_port = 33038
# Chain id for MainNet, please update to match the target node chain id
chain_id = 77658377

[client]
    # maximum size in bytes of a request. Defaults to 50MB
    max_request_body_size = 52428800
    # request timeout
    request_timeout = 60000
    # maximum number of outcoming connections allowed
    max_concurrent_requests = 100
    # certificate_store, `Native` or `WebPki`
    # deprecated: this setting is currently ignored, the client connects to the node over
    # plaintext http/ws/grpc. It is kept to avoid breaking existing configuration files.
    certificate_store = "Native"
    # JSON-RPC request object id data type, `String` or `Number`
    id_kind = "Number"
    # max length for logging for requests and responses. Logs bigger than this limit will be truncated
    max_log_length = 4096
    # custom headers passed to the server with every request (default is empty).
    headers = []

    [client.http]
        # whether to enable HTTP.
        enabled = true

    # TLS towards the node's gRPC servers. Must mirror the node's [grpc.public] and
    # [grpc.private] TLS settings. The default paths match where the node writes the
    # material it generates when its `generate_self_signed_certificates` is enabled,
    # assuming massa-client and massa-node run from sibling directories.
    [client.grpc.public]
        # whether to enable TLS
        enable_tls = false
        # whether to enable mTLS (requires `enable_tls` to be true)
        enable_mtls = false
        # name under which the server certificate is verified; the certificate must list
        # it as a subject alternative name. Self-signed certificates generated by the
        # node always include "localhost".
        server_name = "localhost"
        # certificate authority root used to verify the server certificate
        certificate_authority_root_path = "../massa-node/config/tls_public_ca.pem"
        # client certificate path (only used for mTLS)
        client_certificate_path = "config/tls_public_client.pem"
        # client private key path (only used for mTLS)
        client_private_key_path = "config/tls_public_client.key"

    [client.grpc.private]
        # whether to enable TLS
        enable_tls = false
        # whether to enable mTLS (requires `enable_tls` to be true)
        enable_mtls = false
        # name under which the server certificate is verified; the certificate must list
        # it as a subject alternative name. Self-signed certificates generated by the
        # node always include "localhost".
        server_name = "localhost"
        # certificate authority root used to verify the server certificate
        certificate_authority_root_path = "../massa-node/config/tls_private_ca.pem"
        # client certificate path (only used for mTLS)
        client_certificate_path = "config/tls_private_client.pem"
        # client private key path (only used for mTLS)
        client_private_key_path = "config/tls_private_client.key"
