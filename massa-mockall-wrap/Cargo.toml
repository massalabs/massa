[package]
name = "mockall_wrap"
version = "0.1.0"
authors = ["Massa Labs <info@massa.net>"]
edition = "2021"
description = "A wrapper around mockall mocks to create multiple mock instances that share the same expectations."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["extra-traits", "full"] }
